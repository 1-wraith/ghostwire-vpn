<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c162d" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Neon Cyan to Emerald Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00f59b" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Plate -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="6" />

  <!-- Radar Cyber Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="2" stroke-dasharray="10 14" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0, 245, 155, 0.08)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Shield Shape -->
  <path d="M256 80 L380 135 C380 280 256 390 256 420 C256 390 132 280 132 135 Z" 
        fill="rgba(14, 23, 44, 0.7)" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#neonGlow)" />

  <!-- Ghost Circuit Wire Centerpiece -->
  <!-- Ghost Eyes & Wire Nodes -->
  <path d="M256 160 C210 160 180 195 180 240 C180 300 200 325 210 325 C220 325 230 310 256 310 C282 310 292 325 302 325 C312 325 332 300 332 240 C332 195 302 160 256 160 Z" 
        fill="none" 
        stroke="#00e5ff" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Cyber Eyes -->
  <circle cx="225" cy="235" r="12" fill="#00f59b" filter="url(#neonGlow)" />
  <circle cx="287" cy="235" r="12" fill="#00f59b" filter="url(#neonGlow)" />

  <!-- Encryption Keyhole / Central Node -->
  <path d="M256 265 L256 295" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="265" r="6" fill="#ffffff" />
</svg>
